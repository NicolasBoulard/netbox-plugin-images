# NetBox with one plugin mounted read-only, the way an image volume is (integration/test.sh).
name: netbox-plugin-test

services:
  netbox:
    image: ${NETBOX_IMAGE:?}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: valkey
      REDIS_CACHE_HOST: valkey
      SECRET_KEY: integration-test-only-0123456789abcdefghijklmnopqrstuvwxyz
      SKIP_SUPERUSER: "true"
      PYTHONPATH: /opt/netbox/plugins/plugin
      PLUGIN_MODULE: ${PLUGIN_MODULE:?}
    volumes:
      - ${PLUGIN_CONTENT:?}:/opt/netbox/plugins/plugin:ro
      - ./plugins.py:/etc/netbox/config/plugins.py:ro
    ports:
      - 127.0.0.1:${NETBOX_PORT:-8080}:8080
    healthcheck:
      test: /opt/netbox/health.sh
      start_period: 900s
      start_interval: 5s
      interval: 30s

  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    healthcheck:
      test: pg_isready -q -d netbox -U netbox
      interval: 2s

  valkey:
    image: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    healthcheck:
      test: valkey-cli ping
      interval: 2s
