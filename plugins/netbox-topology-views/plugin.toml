# PyPI distribution of the plugin and its exact version: the version is the image's. Keep these two
# lines together, in this order: Renovate reads them as a pair.
name = "netbox-topology-views"
version = "5.0.2"
# Entry to add to NetBox's PLUGINS.
module = "netbox_topology_views"
homepage = "https://github.com/mattieserver/netbox-topology-views"

# Runtime dependencies NetBox does not ship (anything also in NetBox's venv would shadow it), by
# name only: each comes in its latest version when the plugin was released.
dependencies = []

# NetBox release the image is tested against; the plugin's minor version tracks NetBox's.
netbox = "v4.7.4"

# SPDX license of every package, reviewed by a human: a change upstream fails the build.
[licenses]
netbox-topology-views = "Apache-2.0"
