# Builds a plugin's image content and SBOM in build/<plugin>, checks them against policy/plugin.rego
# and boots NetBox with them. CI and the release workflow both run it, so a release goes through
# exactly the checks its pull request passed.
name: Build and test a plugin
description: Build the image content of plugins/<plugin>, check its licenses and wheels, and test it in NetBox.

inputs:
  plugin:
    description: The plugin's directory under plugins/.
    required: true

outputs:
  description:
    description: The plugin's own one-line summary, from its wheel.
    value: ${{ steps.summary.outputs.description }}

runs:
  using: composite
  steps:
    - id: info
      shell: bash
      env:
        PLUGIN: ${{ inputs.plugin }}
      run: |
        for field in name version dependencies netbox_image; do
          value=$(scripts/plugin.sh info "$PLUGIN" "$field")
          echo "$field=$value" >> "$GITHUB_OUTPUT"
        done
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build content
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        build-args: |
          PLUGIN=${{ steps.info.outputs.name }}
          VERSION=${{ steps.info.outputs.version }}
          DEPENDENCIES=${{ steps.info.outputs.dependencies }}
          NETBOX_IMAGE=${{ steps.info.outputs.netbox_image }}
        sbom: true
        outputs: type=local,dest=build/${{ inputs.plugin }}
    # Licenses, license files and pure Python, from plugin.toml and the SBOM.
    - name: Check content
      shell: bash
      env:
        PLUGIN: ${{ inputs.plugin }}
      run: |
        mv "build/$PLUGIN/sbom.spdx.json" "build/$PLUGIN.spdx.json"
        scripts/plugin.sh check "$PLUGIN" "build/$PLUGIN.spdx.json"
    - name: Summary
      id: summary
      shell: bash
      env:
        PLUGIN: ${{ inputs.plugin }}
      run: |
        description=$(scripts/plugin.sh summary "$PLUGIN" "build/$PLUGIN")
        echo "description=$description" >> "$GITHUB_OUTPUT"
    - name: Integration test
      shell: bash
      env:
        PLUGIN: ${{ inputs.plugin }}
      run: integration/test.sh "$PLUGIN" "build/$PLUGIN"
